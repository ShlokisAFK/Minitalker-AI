<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minitalker</title>

<style>
:root {
    --bg-1: #0b0b0c;
    --bg-2: #111114;
    --glass: rgba(255,255,255,0.08);
    --glass-strong: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.12);
    --text: #f5f5f7;
    --muted: rgba(255,255,255,0.55);
    --accent: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(1200px at 20% 10%, #1a1a1d, var(--bg-1)),
                radial-gradient(1000px at 80% 90%, #141418, var(--bg-2));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    color: var(--text);
    overflow: hidden;
}
#input-area {
    display: flex;
    gap: 12px;
    padding: 16px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
}

#message-input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--glass);
    color: var(--text);
    font-size: 16px;
    resize: none;
    max-height: 140px;
    transition: border 0.2s ease, box-shadow 0.2s ease;
}

#message-input:focus {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
}

#send-btn {
    padding: 0 20px;
    background: var(--accent);
    border: none;
    color: #000;
    border-radius: 16px;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(255,255,255,0.15);
}

#send-btn:active {
    transform: translateY(0);
}
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
}
.label {
    font-size: 11px;
    opacity: 0.5;
    margin-left: 6px;
}

.bubble {
    padding: 14px 18px;
    border-radius: 20px;
    max-width: 82%;
    font-size: 15.5px;
    line-height: 1.5;
    word-break: break-word;
    animation: bubbleIn 0.25s ease;
    backdrop-filter: blur(10px);
}

.user {
    align-self: flex-end;
    background: #ffffff;
    color: #000;
    border-bottom-right-radius: 6px;
}

.bot {
    align-self: flex-start;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
}
#typing {
    display: none;
    align-self: flex-start;
    background: var(--glass);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 18px;
    border-bottom-left-radius: 6px;
}

.dot {
    height: 6px;
    width: 6px;
    background: var(--text);
    border-radius: 50%;
    display: inline-block;
    margin: 0 3px;
    animation: blink 1.2s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
}

@keyframes bubbleIn {
    from {
        opacity: 0;
        transform: translateY(6px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
@media (max-width: 600px) {
    #chat {
        padding-top: 24px;
    }
}
</style>

<script>
async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    addMessage("You", text, "user");
    input.value = "";
    autoGrow(input);
    input.focus();

    showTyping(true);
    const botBubble = addMessage("Minitalker", "", "bot");

    try {
        const response = await fetch("/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                messages: [{ role: "user", content: text }]
            })
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        botBubble.innerText = data.choices[0].message.content;

    } catch (err) {
        botBubble.innerText = "Something broke on the backend 💀";
        console.error(err);
    } finally {
        showTyping(false);
    }
}

function addMessage(label, text, sender) {
    const chat = document.getElementById("chat");

    const labelDiv = document.createElement("div");
    labelDiv.className = "label";
    labelDiv.innerText = label;
    chat.appendChild(labelDiv);

    const div = document.createElement("div");
    div.className = "bubble " + sender;
    div.innerText = text;
    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
    return div;
}

function showTyping(state) {
    const typing = document.getElementById("typing");
    typing.style.display = state ? "block" : "none";
}

function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>
</head>

<body>

<div id="input-area">
    <textarea id="message-input" rows="1"
        placeholder="Type your message..."
        oninput="autoGrow(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<div id="chat"></div>

<div id="typing" style="margin-left:18px; margin-bottom:12px;">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>

</body>
</html>
